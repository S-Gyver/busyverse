<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TEAM 3P - Virtual Office & Character Creator</title>
  <link rel="stylesheet" href="./src/styles/office.css" />
</head>
<body>

<div class="office-frame">
  <canvas id="officeCanvas" class="office-canvas" width="960" height="640"></canvas>

  <!-- Top HUD ในออฟฟิศ -->
  <div class="top-hud">
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span>สถานะ: <b id="statusText">กำลังโหลดชุดภาพ...</b></span>
    </div>
    <div class="top-hud-right">
      <div class="status-badge">
        <span>ทิศทาง: <b id="facingText">หน้า (Front)</b></span>
      </div>
      <button class="open-creator-btn" id="btnOpenCreator">🎨 สร้าง / แต่งตัวละคร</button>
    </div>
  </div>

  <!-- Bottom Action & Emote Bar ในออฟฟิศ -->
  <div class="hud-bottom">
    <div class="guide-text" id="zoneHint"></div>
    <div class="emote-bar" id="emoteBar"></div>
  </div>

  <!-- หน้าจอสร้างตัวละครสไตล์ RPG (เปิดขึ้นมาให้ทดลองสร้างทันที) -->
  <div class="creator-overlay" id="creatorOverlay">
    <div class="creator-topbar">
      <button class="creator-back-btn" id="btnCloseCreator">
        <span>《</span> <span>สร้างตัวละคร</span>
      </button>
      <span class="creator-topbar-subtitle">
        ⚔️ Ragnarok Online — Novice Male 8 ทิศทาง พร้อมทรงผม 30 แบบ
      </span>
    </div>

    <div class="creator-stage-area" id="creatorStageArea">
      <div class="creator-body creator-body-wrapper" id="creatorBodyWrapper">
        <!-- ฝั่งซ้าย: เลือกตัวละคร + เลือกทรงผม -->
        <div class="creator-left">
          <div>
            <div class="panel-section-title">
              <span>เลือกตัวละคร</span>
            </div>
            <div class="preset-grid" id="presetGrid"></div>

            <div class="panel-section-title" style="margin-top: 14px;">
              <span>ทรงผม RO (Hair)</span>
              <span id="hairSelectLabel" style="font-size: 11.5px; color: #fde68a;">ทรงที่ 1/30</span>
            </div>
            <div class="hair-grid" id="hairGrid"></div>
          </div>
        </div>

        <!-- ตรงกลาง: แท่นยืนตัวละคร + ชื่อตัวละคร + คำอธิบาย -->
        <div class="creator-center">
          <div class="preview-controls">
            <button class="preview-ctrl-btn active" data-pose="idle">● ยืนพรีวิว</button>
            <button class="preview-ctrl-btn" data-pose="walk">▶ ทดสอบเดิน</button>
            <button class="preview-ctrl-btn" data-pose="run">▶▶ ทดสอบวิ่ง</button>
            <button class="preview-ctrl-btn" data-pose="sit">🪑 ทดสอบนั่ง</button>
            <button class="preview-ctrl-btn" data-pose="sleep">🛏️ ทดสอบนอน</button>
          </div>

          <div class="name-input-box">
            <label for="charNameInput">ชื่อตัวละคร:</label>
            <input type="text" id="charNameInput" value="คุณ (Lead)" maxlength="22" />
          </div>

          <div class="pedestal-stage">
            <canvas id="creatorPreviewCanvas" width="460" height="520"></canvas>
          </div>

          <div class="lore-box" id="loreDesc">
            ตัวละคร Novice ชาย จาก Ragnarok Online รองรับการหันครบ 8 ทิศทาง พร้อมทรงผม 30 แบบ
          </div>
        </div>

        <!-- ฝั่งขวา: หมุนดูทิศทาง (8 ทิศทาง) + ปุ่มสร้าง -->
        <div class="creator-right">
          <div>
            <div class="panel-section-title">
              <span>หมุนดูทิศทาง (8 ทิศทาง)</span>
              <span id="costumeCategoryLabel" style="font-size: 11.5px; color: #fde68a;">RO Novice</span>
            </div>

            <div class="costume-panel">
              <div class="costume-grid" id="costumeGrid"></div>
            </div>
          </div>

          <div class="creator-action-btns">
            <button class="btn-create-gold" id="btnCreateConfirm">สร้าง</button>
            <button class="btn-spawn-friend" id="btnSpawnFriend" title="เสกตัวละครชุดนี้เพิ่มลงในห้องออฟฟิศ">➕ เพิ่มเพื่อนในห้อง</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
